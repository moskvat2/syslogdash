services:
  dashboard:
    image: webdevops/php-apache:8.4
    container_name: syslog-dashboard
    ports:
      - "5700:80"
    volumes:
      - ./public:/var/www/html
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    restart: always
    environment:
      - TZ=America/Sao_Paulo
      - WEB_DOCUMENT_ROOT=/var/www/html

  syslog-server:
    image: python:3.11-slim
    container_name: syslog-server
    volumes:
      - ./:/app
    working_dir: /app
    ports:
      - "514:514/udp"
    restart: always
    environment:
      - TZ=America/Sao_Paulo
    # Instala o driver do MySQL e roda o script toda vez que iniciar para evitar build customizado
    command: sh -c "pip install --no-cache-dir mysql-connector-python && python main.py"
